[project]
name = "llm-time-learning-pilot"
version = "0.1.0"
description = "Isolated uv project for ordinary-KL learning-pilot CPU vs CUDA torch"
requires-python = ">=3.10"
dependencies = [
    "llm-rl-engine",
]

[project.optional-dependencies]
cpu = [
    "numpy>=1.26",
    "torch>=2.5.0",
    "transformers>=4.51.0",
    "peft>=0.14.0",
    "accelerate>=1.2.0",
    "huggingface-hub>=0.26.0",
    "safetensors>=0.4.5",
]
cu124 = [
    "numpy>=1.26",
    "torch>=2.5.0",
    "transformers>=4.51.0",
    "peft>=0.14.0",
    "accelerate>=1.2.0",
    "huggingface-hub>=0.26.0",
    "safetensors>=0.4.5",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu124" },
    ],
]

[tool.uv.sources]
llm-rl-engine = { path = "..", editable = true }
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "cu124" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
