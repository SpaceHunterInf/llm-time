# P2 / C3: three-stage sinusoidal StagedBandit (same family, new params each stage)
# Within-family cycle reset: period/phase/best arm resampled at hard cuts.
experiment_name: benchmark_staged_sinusoidal_p2
horizon: 90
n_episodes: 5
seeds: [0, 1, 2, 3, 4]
llm_parallel_workers: 5
generate_plots: true

environments:
  - name: StagedBandit
    n_arms: 4
    stage_length: 30
    force_distinct_best_arms: true
    strong_p: 0.85
    weak_p: 0.20
    period_range: [8, 16]
    amplitude_range: [0.15, 0.35]
    base_range: [0.25, 0.65]
    description_mode: blind
    stages:
      - family: sinusoidal
      - family: sinusoidal
      - family: sinusoidal

agents:
  - name: random
  - name: greedy
  - name: ucb
  - name: thompson_sampling
  - name: sliding_window_ucb
    window: 10
  - name: oracle
  - name: llm_raw_history
    model: gemini-3.5-flash
    temperature: 0
    max_retries: 1
