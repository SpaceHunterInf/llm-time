# Prompt ablation on P2 dynamics (3x sinusoidal, H=90).
# Same env physics; only LLM task description changes (blind / aware / minimal).
experiment_name: benchmark_staged_p2_prompt_ablation
horizon: 90
n_episodes: 5
seeds: [0, 1, 2, 3, 4]
llm_parallel_workers: 5
generate_plots: true

environments:
  - name: StagedBandit
    n_arms: 4
    stage_length: 30
    force_distinct_best_arms: true
    strong_p: 0.85
    weak_p: 0.20
    period_range: [8, 16]
    amplitude_range: [0.15, 0.35]
    base_range: [0.25, 0.65]
    description_mode: blind
    stages:
      - family: sinusoidal
      - family: sinusoidal
      - family: sinusoidal

agents:
  - name: random
  - name: greedy
  - name: ucb
  - name: thompson_sampling
  - name: sliding_window_ucb
    window: 10
  - name: oracle

  - name: llm_blind
    prompt_mode: raw_history
    description_mode: blind
    n_arms: 4
    model: gemini-3.5-flash
    temperature: 0
    max_retries: 1

  - name: llm_aware
    prompt_mode: raw_history
    description_mode: aware
    n_arms: 4
    model: gemini-3.5-flash
    temperature: 0
    max_retries: 1

  - name: llm_minimal
    prompt_mode: raw_history
    description_mode: minimal
    n_arms: 4
    model: gemini-3.5-flash
    temperature: 0
    max_retries: 1
