[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-rl-engine"
version = "0.1.0"
description = "RL engine for benchmarking frozen LLM agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "google-genai>=2.10.0",
    "matplotlib>=3.8.0",
]

[project.scripts]
llm-rl-benchmark = "llm_rl_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_rl_engine*"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
