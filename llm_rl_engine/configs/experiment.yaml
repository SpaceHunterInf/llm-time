experiment_name: benchmark_50turns_gemini35_v3
horizon: 50
n_episodes: 5
seeds: [0, 1, 2, 3, 4]
llm_parallel_workers: 5
generate_plots: true

environments:
  - name: NumberGuess
    target_min: 0
    target_max: 100
    feedback: exact_comparison
  - name: StationaryBandit
    n_arms: 4
    alpha: 1
    beta: 1
  - name: ReversalBandit
    n_arms: 4
    reversal_schedule: fixed_hidden_time
    reversal_time_range: [15, 35]

agents:
  - name: random
  - name: greedy
  - name: ucb
    environments: [StationaryBandit, ReversalBandit]
  - name: thompson_sampling
    environments: [StationaryBandit, ReversalBandit]
  - name: sliding_window_ucb
    window: 10
    environments: [StationaryBandit, ReversalBandit]
  - name: llm_raw_history
    model: gemini-3.5-flash
    temperature: 0
    max_retries: 1