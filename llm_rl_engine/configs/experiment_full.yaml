experiment_name: benchmark_full_suite
horizon: 50
n_episodes: 5
seeds: [0, 1, 2, 3, 4]
llm_parallel_workers: 5
generate_plots: true

environments:
  - name: NumberGuess
    target_min: 0
    target_max: 100
    feedback: exact_comparison
  - name: StationaryBandit
    n_arms: 4
  - name: ReversalBandit
    n_arms: 4
    reversal_time_range: [15, 35]
  - name: PeriodicBandit
    n_arms: 4
    shared_period: true
    period_range: [8, 16]
    amplitude_range: [0.15, 0.35]
    base_range: [0.25, 0.65]
  - name: DriftingBandit
    n_arms: 4
    sigma: 0.03
  - name: PendulumGate
    period_range: [8, 16]
    max_lives: 3

agents:
  - name: random
  - name: greedy
  - name: ucb
    environments: [StationaryBandit, ReversalBandit, PeriodicBandit, DriftingBandit]
  - name: thompson_sampling
    environments: [StationaryBandit, ReversalBandit, PeriodicBandit, DriftingBandit]
  - name: sliding_window_ucb
    window: 10
    environments: [ReversalBandit, PeriodicBandit, DriftingBandit]
  - name: llm_raw_history
    model: gemini-3.5-flash
    temperature: 0
    max_retries: 1