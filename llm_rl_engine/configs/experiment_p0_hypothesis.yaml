# Phase 0: hypothesis / confidence / heuristic loop on blind P0.
# Interface default: stats table + last 10 raw steps (see 09_research_roadmap.md §4.1).
# Smoke: 5 seeds. Paper-scale should use 20+ seeds.
experiment_name: benchmark_p0_hypothesis_phase0
horizon: 90
n_episodes: 5
seeds: [0, 1, 2, 3, 4]
llm_parallel_workers: 5
generate_plots: true

environments:
  - name: StagedBandit
    n_arms: 4
    stage_length: 30
    force_distinct_best_arms: true
    strong_p: 0.85
    weak_p: 0.20
    description_mode: blind
    stages:
      - family: constant
      - family: constant
      - family: constant

agents:
  - name: random
  - name: greedy
  - name: ucb
  - name: sliding_window_ucb
    window: 10
  - name: oracle
  - name: llm_hypothesis
    prompt_mode: hypothesis_loop
    interface: stats_plus_recent
    history_tail: 10
    stats_last_k: 5
    n_arms: 4
    model: gemini-3.5-flash
    temperature: 0
    max_retries: 1
