experiment_name: benchmark_time_hard
horizon: 50
n_episodes: 5
seeds: [0, 1, 2, 3, 4]
llm_parallel_workers: 5
generate_plots: true

environments:
  - name: TrafficLightGate
    period_range: [8, 16]
    green_fraction: 0.30
    yellow_fraction: 0.15
    dt: 0.6
    episode_max_time_s: 30.0
    max_lives: 3
    phase_shift_time_range: [12, 22]
    phase_shift_delta_range: [0.25, 0.45]
  - name: PhaseLockedBandit
    n_arms: 4
    shared_period: true
    period_range: [12, 20]
    active_threshold: 0.5
    active_prob: 0.85
    inactive_prob: 0.05

agents:
  - name: random
  - name: greedy
  - name: ucb
    environments: [PhaseLockedBandit]
  - name: thompson_sampling
    environments: [PhaseLockedBandit]
  - name: sliding_window_ucb
    window: 10
    environments: [PhaseLockedBandit]
  - name: oracle
  - name: llm_raw_history
    model: gemini-3.5-flash
    temperature: 0
    max_retries: 1