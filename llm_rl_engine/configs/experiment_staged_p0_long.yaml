# Experiment A: P0-long — stretch discrete best-arm falsification
# 6 constant stages x L=30 => H=180, blind task text only.
# See 08_next_directions.md
experiment_name: benchmark_staged_p0_long
horizon: 180
n_episodes: 5
seeds: [0, 1, 2, 3, 4]
llm_parallel_workers: 5
generate_plots: true

environments:
  - name: StagedBandit
    n_arms: 4
    stage_length: 30
    force_distinct_best_arms: true
    strong_p: 0.85
    weak_p: 0.20
    description_mode: blind
    stages:
      - family: constant
      - family: constant
      - family: constant
      - family: constant
      - family: constant
      - family: constant

agents:
  - name: random
  - name: greedy
  - name: ucb
  - name: thompson_sampling
  - name: sliding_window_ucb
    window: 10
  - name: oracle
  - name: llm_raw_history
    model: gemini-3.5-flash
    temperature: 0
    max_retries: 1
